# clouderby Server App Configuration for mulet

http:
  port: "9081"

# Derby embedded connection (different path to avoid lock conflict with Mule standalone)
derby:
  path: "/tmp/data/mulet-appdb"

# Authentication
clouderby:
  user: "mule"
  password: "mule123"

# Database initialization (CNET schema + sample data)
db:
  init:
    enabled: "true"
    # 起動時に投入するデータセットプロファイル: manufacturing | finance
    # (UI の Profiles タブから実行時に切り替え可能)
    profile: "manufacturing"
